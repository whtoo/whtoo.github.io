<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font-family: Arial; font-size: 20px; font-weight: bold; fill: #333; }
      .box { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .box-green { fill: #d4edda; stroke: #28a745; stroke-width: 2; }
      .box-red { fill: #f8d7da; stroke: #dc3545; stroke-width: 2; }
      .box-yellow { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; }
      .box-gray { fill: #e2e3e5; stroke: #6c757d; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .label { font-family: Arial; font-size: 14px; fill: #333; }
      .label-red { font-family: Arial; font-size: 12px; fill: #dc3545; }
      .label-green { font-family: Arial; font-size: 12px; fill: #28a745; }
      .sublabel { font-family: Arial; font-size: 11px; fill: #666; }
      .missing { stroke: #dc3545; stroke-width: 2; stroke-dasharray: 5,3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">图 1：OpenClaw Session 生命周期现状（黑盒）</text>

  <!-- Session 1 -->
  <rect x="50" y="80" width="200" height="100" rx="8" class="box-green"/>
  <text x="150" y="105" text-anchor="middle" class="label">Session A</text>
  <text x="150" y="125" text-anchor="middle" class="sublabel">sessionId: da800e88-...</text>
  <text x="150" y="145" text-anchor="middle" class="sublabel">startedAt: t₀</text>
  <text x="150" y="165" text-anchor="middle" class="sublabel">✅ 正常</text>

  <!-- Arrow: Session A -> Terminated -->
  <line x1="250" y1="130" x2="310" y2="130" class="arrow"/>
  <text x="280" y="120" text-anchor="middle" class="sublabel">SIGTERM</text>

  <!-- Terminated (Unknown Reason) -->
  <rect x="320" y="80" width="160" height="100" rx="8" class="box-red"/>
  <text x="400" y="105" text-anchor="middle" class="label">Session Terminated</text>
  <text x="400" y="130" text-anchor="middle" class="sublabel">reason: ❌ 不记录</text>
  <text x="400" y="150" text-anchor="middle" class="sublabel">who sent SIGTERM?</text>
  <text x="400" y="170" text-anchor="middle" class="sublabel">❌ 无法追溯</text>

  <!-- Arrow: Terminated -> Session B -->
  <line x1="480" y1="130" x2="540" y2="130" class="arrow"/>
  <text x="510" y="120" text-anchor="middle" class="sublabel">restart</text>

  <!-- Session 2 -->
  <rect x="550" y="80" width="200" height="100" rx="8" class="box-green"/>
  <text x="650" y="105" text-anchor="middle" class="label">Session B</text>
  <text x="650" y="125" text-anchor="middle" class="sublabel">sessionId: e0a23488-...</text>
  <text x="650" y="145" text-anchor="middle" class="sublabel">startedAt: t₁</text>
  <text x="650" y="165" text-anchor="middle" class="sublabel">✅ 新建</text>

  <!-- ctx engine box -->
  <rect x="200" y="260" width="400" height="80" rx="8" class="box-gray"/>
  <text x="400" y="285" text-anchor="middle" class="label">ctx engine (SPC-CTX)</text>
  <text x="400" y="305" text-anchor="middle" class="sublabel">收到新 Session ID</text>
  <text x="400" y="325" text-anchor="middle" class="label-red">❓ 是用户主动 /new 还是系统重启？</text>

  <!-- Missing information -->
  <rect x="50" y="360" width="700" height="30" rx="5" class="missing"/>
  <text x="400" y="380" text-anchor="middle" class="label-red">缺失：terminationReason | previousSessionId | isResumed | lastSessionEndedAt</text>

  <!-- Scenario labels -->
  <text x="150" y="210" text-anchor="middle" class="label-green">场景 1: 用户主动 /new</text>
  <text x="650" y="210" text-anchor="middle" class="label-green">场景 2: 系统崩溃重启</text>
  <text x="400" y="230" text-anchor="middle" class="label-red">两种场景 Session ID 都变化，但 ctx engine 无法区分！</text>
</svg>
