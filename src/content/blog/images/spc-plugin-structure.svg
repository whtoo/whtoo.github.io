  <rect x="640" y="300" width="180" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="730" y="322" text-anchor="middle" fill="#22c55e" font-family="SF Mono, Consolas, monospace" font-size="10">{</text>
  <text x="730" y="340" text-anchor="middle" fill="#94a3b8" font-family="SF Mono, Consolas, monospace" font-size="10">  "plugin": ["file:///..."]</text>
  <text x="730" y="352" text-anchor="middle" fill="#22c55e" font-family="SF Mono, Consolas, monospace" font-size="10">}</text>

