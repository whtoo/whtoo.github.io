  <line x1="440" y1="325" x2="380" y2="325" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Arrow from hooks to types -->
  <line x1="460" y1="340" x2="510" y2="340" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- File content preview -->
  <rect x="50" y="200" width="200" height="260" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="150" y="225" text-anchor="middle" fill="#f8fafc" font-family="SF Mono, Consolas, monospace" font-size="12" font-weight="bold">关键代码片段</text>

  <text x="65" y="250" fill="#a855f7" font-family="SF Mono, Consolas, monospace" font-size="10">// messages.transform</text>
  <text x="65" y="268" fill="#94a3b8" font-family="SF Mono, Consolas, monospace" font-size="9">"experimental.chat.</text>
  <text x="65" y="282" fill="#94a3b8" font-family="SF Mono, Consolas, monospace" font-size="9"> messages.transform"</text>
  <text x="65" y="300" fill="#f8fafc" font-family="SF Mono, Consolas, monospace" font-size="9">async (_input, output) {</text>
  <text x="75" y="316" fill="#94a3b8" font-family="SF Mono, Consolas, monospace" font-size="9">const { messages } = output</text>
  <text x="75" y="332" fill="#94a3b8" font-family="SF Mono, Consolas, monospace" font-size="9">const spcCtx = spc.assemble()</text>
  <text x="75" y="348" fill="#94a3b8" font-family="SF Mono, Consolas, monospace" font-size="9">const drift = spc.detectDrift()</text>
  <text x="65" y="368" fill="#f8fafc" font-family="SF Mono, Consolas, monospace" font-size="9">}</text>

  <!-- SDK Info -->
  <rect x="50" y="480" width="200" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="505" text-anchor="middle" fill="#3b82f6" font-family="SF Mono, Consolas, monospace" font-size="11" font-weight="bold">SDK 依赖</text>
  <text x="65" y="528" fill="#94a3b8" font-family="SF Mono, Consolas, monospace" font-size="10">@opencode-ai/plugin</text>
  <text x="65" y="546" fill="#94a3b8" font-family="SF Mono, Consolas, monospace" font-size="10">@opencode-ai/sdk</text>

  <!-- Marker definitions -->
  <defs>
    <marker id="arrow-grn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22c55e"/></marker>
