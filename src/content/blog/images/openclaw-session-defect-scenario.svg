<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <style>
      .title { font-family: Arial; font-size: 18px; font-weight: bold; fill: #333; }
      .box { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .box-green { fill: #d4edda; stroke: #28a745; stroke-width: 2; }
      .box-red { fill: #f8d7da; stroke: #dc3545; stroke-width: 2; }
      .box-blue { fill: #cce5ff; stroke: #007bff; stroke-width: 2; }
      .box-gray { fill: #e2e3e5; stroke: #6c757d; stroke-width: 2; }
      .box-orange { fill: #fff3cd; stroke: #fd7e14; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 2; }
      .arrow-green { stroke: #28a745; stroke-width: 2; }
      .arrow-red { stroke: #dc3545; stroke-width: 2; stroke-dasharray: 5,3; }
      .label { font-family: Arial; font-size: 13px; fill: #333; }
      .label-small { font-family: Arial; font-size: 11px; fill: #666; }
      .label-red { font-family: Arial; font-size: 12px; fill: #dc3545; font-weight: bold; }
      .label-green { font-family: Arial; font-size: 12px; fill: #28a745; font-weight: bold; }
      .label-blue { font-family: Arial; font-size: 12px; fill: #007bff; }
      .sublabel { font-family: Arial; font-size: 10px; fill: #666; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">图 2：缺陷场景分析——ctx engine 的被动困境</text>

  <!-- Left Column: User Action -->
  <rect x="30" y="50" width="350" height="200" rx="8" class="box-green"/>
  <text x="205" y="75" text-anchor="middle" class="label" font-weight="bold">场景 A：用户主动 /new</text>

  <text x="50" y="100" class="sublabel">1. 用户输入 /new</text>
  <text x="50" y="118" class="sublabel">2. OpenClaw 创建新 Session</text>
  <text x="50" y="136" class="sublabel">3. bootstrap 注入 ctx engine</text>
  <text x="50" y="154" class="sublabel">4. ctx engine 收到新 Session ID</text>

  <rect x="50" y="165" width="310" height="30" rx="4" fill="#d4edda"/>
  <text x="205" y="185" text-anchor="middle" class="label-green">✅ 正确行为：丢弃旧状态</text>

  <text x="50" y="215" class="sublabel">reason: "user_requested"</text>
  <text x="50" y="233" class="sublabel">previousSessionId: "da800e88-..."</text>
  <text x="50" y="245" class="label-green">→ 可以安全丢弃</text>

  <!-- Right Column: System Crash -->
  <rect x="420" y="50" width="350" height="200" rx="8" class="box-red"/>
  <text x="595" y="75" text-anchor="middle" class="label" font-weight="bold">场景 B：系统崩溃被迫重启</text>

  <text x="440" y="100" class="sublabel">1. 系统收到 SIGTERM</text>
  <text x="440" y="118" class="sublabel">2. Session 状态未持久化</text>
  <text x="440" y="136" class="sublabel">3. launchd 自动重启</text>
  <text x="440" y="154" class="sublabel">4. ctx engine 收到新 Session ID</text>

  <rect x="440" y="165" width="310" height="30" rx="4" fill="#f8d7da"/>
  <text x="595" y="185" text-anchor="middle" class="label-red">❌ 当前行为：丢弃旧状态</text>

  <text x="440" y="215" class="sublabel">reason: "unknown" ❌</text>
  <text x="440" y="233" class="sublabel">previousSessionId: null ❌</text>
  <text x="440" y="245" class="label-red">→ 历史经验丢失！</text>

  <!-- Consequence Section -->
  <rect x="30" y="270" width="740" height="100" rx="8" class="box-orange"/>
  <text x="400" y="295" text-anchor="middle" class="label" font-weight="bold">SPC-CTX DER 负向过滤失效的后果</text>

  <text x="50" y="320" class="sublabel">• DER miss 记录丢失 → 同一错误方向被重复探索</text>
  <text x="50" y="340" class="sublabel">• Phase 状态重置 → QTS 权重归零</text>
  <text x="50" y="360" class="sublabel">• 热经验失效 → hitCount ≥ 3 的经验被部分丢弃</text>

  <!-- Bottom: The Core Problem -->
  <rect x="30" y="390" width="740" height="60" rx="8" class="box-gray"/>
  <text x="400" y="420" text-anchor="middle" class="label" font-weight="bold">核心问题：ctx engine 只能被动等 OpenClaw 注入，但注入信息不完整</text>
  <text x="400" y="440" text-anchor="middle" class="label-red">bootstrap 信息缺少：terminationReason | isResumed | previousSessionId</text>
</svg>
