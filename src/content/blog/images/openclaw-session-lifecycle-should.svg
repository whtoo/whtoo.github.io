<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <style>
      .title { font-family: Arial; font-size: 18px; font-weight: bold; fill: #333; }
      .box { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .box-green { fill: #d4edda; stroke: #28a745; stroke-width: 2; }
      .box-blue { fill: #cce5ff; stroke: #007bff; stroke-width: 2; }
      .box-gray { fill: #e2e3e5; stroke: #6c757d; stroke-width: 2; }
      .box-orange { fill: #fff3cd; stroke: #fd7e14; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 2; }
      .arrow-green { stroke: #28a745; stroke-width: 2; }
      .arrow-blue { stroke: #007bff; stroke-width: 2; }
      .label { font-family: Arial; font-size: 13px; fill: #333; }
      .label-small { font-family: Arial; font-size: 11px; fill: #666; }
      .label-green { font-family: Arial; font-size: 12px; fill: #28a745; font-weight: bold; }
      .label-blue { font-family: Arial; font-size: 12px; fill: #007bff; }
      .sublabel { font-family: Arial; font-size: 10px; fill: #666; }
      .tag { font-family: Arial; font-size: 10px; fill: white; }
      .tag-green { fill: #28a745; }
      .tag-red { fill: #dc3545; }
      .tag-blue { fill: #007bff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">图 3：应该记录的 Session 生命周期</text>

  <!-- Session A with full info -->
  <rect x="30" y="50" width="220" height="140" rx="8" class="box-blue"/>
  <text x="140" y="75" text-anchor="middle" class="label" font-weight="bold">Session A</text>
  <rect x="40" y="85" width="60" height="16" rx="3" class="tag-blue"/>
  <text x="70" y="96" text-anchor="middle" class="tag">CREATED</text>
  <text x="120" y="96" class="sublabel">t₀</text>

  <text x="45" y="115" class="sublabel">sessionId: da800e88</text>
  <text x="45" y="130" class="sublabel">createdBy: user_action</text>
  <text x="45" y="145" class="sublabel">previousSessionId: null</text>
  <text x="45" y="160" class="sublabel">isResumed: false</text>
  <text x="45" y="175" class="sublabel">terminationReason: —</text>

  <!-- Arrow with label -->
  <line x1="250" y1="120" x2="295" y2="120" class="arrow" marker-end="url(#arrow)"/>
  <text x="272" y="110" text-anchor="middle" class="sublabel">SIGTERM</text>
  <text x="272" y="135" text-anchor="middle" class="label-green">写入 .state.json</text>

  <!-- Session State Snapshot -->
  <rect x="305" y="70" width="160" height="100" rx="8" class="box-orange"/>
  <text x="385" y="95" text-anchor="middle" class="label" font-weight="bold">.state.json</text>
  <text x="320" y="115" class="sublabel">der.missRecords[]</text>
  <text x="320" y="130" class="sublabel">phase.current</text>
  <text x="320" y="145" class="sublabel">qts.weights</text>
  <text x="320" y="160" class="sublabel">hot.exp.hitCount</text>

  <!-- Arrow to Session B -->
  <line x1="465" y1="120" x2="510" y2="120" class="arrow" marker-end="url(#arrow)"/>
  <text x="487" y="110" text-anchor="middle" class="sublabel">restart</text>
  <text x="487" y="135" text-anchor="middle" class="label-blue">读取 .state.json</text>

  <!-- Session B (Resumed) -->
  <rect x="520" y="50" width="250" height="140" rx="8" class="box-green"/>
  <text x="645" y="75" text-anchor="middle" class="label" font-weight="bold">Session B (Resumed)</text>
  <rect x="530" y="85" width="80" height="16" rx="3" class="tag-green"/>
  <text x="570" y="96" text-anchor="middle" class="tag">RESUMED</text>
  <text x="690" y="96" class="sublabel">t₁</text>

  <text x="535" y="115" class="sublabel">sessionId: e0a23488</text>
  <text x="535" y="130" class="sublabel">createdBy: system_restart</text>
  <text x="535" y="145" class="sublabel">previousSessionId: da800e88</text>
  <text x="535" y="160" class="sublabel">isResumed: true ✅</text>
  <text x="535" y="175" class="sublabel">terminationReason: system_shutdown</text>

  <!-- Lifecycle Log -->
  <rect x="30" y="220" width="740" height="100" rx="8" class="box-gray"/>
  <text x="400" y="245" text-anchor="middle" class="label" font-weight="bold">.session_lifecycle.jsonl</text>

  <text x="50" y="270" class="sublabel">{"event":"session_created","sessionId":"da800e88","at":t₀,"reason":"user_action"}</text>
  <text x="50" y="288" class="sublabel">{"event":"session_terminated","sessionId":"da800e88","at":t₁,"reason":"system_shutdown","signal":"SIGTERM"}</text>
  <text x="50" y="306" class="sublabel">{"event":"session_created","sessionId":"e0a23488","at":t₁,"reason":"system_restart","resumedFrom":"da800e88"}</text>

  <!-- Benefits -->
  <rect x="30" y="340" width="740" height="60" rx="8" class="box-green"/>
  <text x="400" y="365" text-anchor="middle" class="label" font-weight="bold">ctx engine 现在可以精准决策：</text>
  <text x="50" y="385" class="label-green">✅ 用户主动 /new → 丢弃旧状态</text>
  <text x="400" y="385" class="label-green">✅ 系统重启 → 恢复 .state.json 中的上下文模型状态</text>
</svg>
